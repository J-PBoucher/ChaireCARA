name: Déploiement vers le cPanel WHC
 
on:
 push:
   branches: [main]   # remplacez par "master" si c'est le nom de votre branche principale
 
jobs:
 build-and-deploy:
   runs-on: ubuntu-latest
   steps:
     - name: Cloner le dépôt
       uses: actions/checkout@v4
 
     - name: Installer Quarto
       uses: quarto-dev/quarto-actions/setup@v2
 
     - name: Générer le site
       run: quarto render
 
     - name: Déployer vers WHC via SFTP
       uses: wlixcc/SFTP-Deploy-Action@v1.2.4
       with:
         username: ${{ secrets.SFTP_USERNAME }}
         server: ${{ secrets.SFTP_HOST }}
         port: ${{ secrets.SFTP_PORT }}
         password: ${{ secrets.SFTP_PASSWORD }}
         local_path: './_site/*'
         remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
         sftp_only: true
 
