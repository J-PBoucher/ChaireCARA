name: Déploiement vers le cPanel WHC

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Installer la clé SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat > ~/.ssh/askpass.sh << 'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_PASSPHRASE"
          EOF

          chmod 700 ~/.ssh/askpass.sh

      - name: Tester la connexion SSH
        env:
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          export SSH_ASKPASS="$HOME/.ssh/askpass.sh"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0

          ssh -o StrictHostKeyChecking=no \
              -o BatchMode=no \
              -i ~/.ssh/deploy_key \
              -p 2243 \
              chaireca@chairecara.uqam.ca \
              "echo 'Connexion SSH réussie'"

      - name: Tester l'écriture SFTP
        env:
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          export SSH_ASKPASS="$HOME/.ssh/askpass.sh"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0

          echo "Test GitHub $(date)" > test-github.txt

          printf 'put test-github.txt /home/chaireca/public_html/test-github.txt\n' | \
            sftp -o StrictHostKeyChecking=no \
                 -o BatchMode=no \
                 -i ~/.ssh/deploy_key \
                 -P 2243 \
                 chaireca@chairecara.uqam.ca
