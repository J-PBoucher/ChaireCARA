Le problème n'est pas lié à SFTP mais à l'étape juste avant : « Générer le site » (quarto render).
Ce qui se passe :

Quarto essaie d'exécuter un script R (load.R, probablement défini en pré-rendu dans _quarto.yml ou dans un des .qmd). Or, le runner GitHub Actions (ubuntu-latest) ne contient pas R par défaut — seul Quarto a été installé, pas R. D'où l'erreur :
 
 
ERROR: Error executing 'Rscript': Failed to spawn 'Rscript': entity not found
 
Ça veut dire concrètement : « la commande Rscript n'existe pas sur cette machine ».
La solution : ajouter une étape qui installe R dans le workflow, avant quarto render.
Modifiez .github/workflows/deploy-whc.yml pour ajouter une étape avec l'action officielle r-lib/actions/setup-r :
 
name: Déploiement vers le cPanel WHC

on:

  push:

    branches: [main]

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Cloner le dépôt

        uses: actions/checkout@v4
 
      - name: Installer R

        uses: r-lib/actions/setup-r@v2

        with:

          r-version: '4.4.1'
 
      - name: Installer les packages R nécessaires

        uses: r-lib/actions/setup-renv@v2

        # ou, si vous n'utilisez pas renv, remplacez par :

        # run: Rscript -e 'install.packages(c("nom_du_package1", "nom_du_package2"))'
 
      - name: Installer Quarto

        uses: quarto-dev/quarto-actions/setup@v2
 
      - name: Générer le site

        run: quarto render
 
      - name: Déployer vers WHC via SFTP

        uses: wlixcc/SFTP-Deploy-Action@v1.2.4

        with:

          username: ${{ secrets.SFTP_USERNAME }}

          server: ${{ secrets.SFTP_HOST }}

          port: ${{ secrets.SFTP_PORT }}

          password: ${{ secrets.SFTP_PASSWORD }}

          local_path: './www/*'

          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}

          sftp_only: true
 
 
 
