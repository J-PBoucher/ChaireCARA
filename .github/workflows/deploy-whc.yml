name: Déploiement vers le cPanel WHC

on:
  push:
    branches: [main]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4
 
      - name: Installer R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
 
      - name: Installer les packages R nécessaires
        # uses: r-lib/actions/setup-renv@v2
        # ou, si vous n'utilisez pas renv, remplacez par :
        run: Rscript -e 'install.packages(c("dplyr", "toastui", "DT", "lubridate", "anytime", "stringr", "readxl"))'

      - name: Installer Quarto
        uses: quarto-dev/quarto-actions/setup@v2
 
      - name: Générer le site
        run: quarto render
 
      - name: Déployer vers WHC via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4

        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: './www/*'
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          sftp_only: true
 
 
 
