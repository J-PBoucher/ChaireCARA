name: Déploiement vers le cPanel WHC

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4

      - name: Déployer vers WHC via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: chaireca
          server: chairecara.uqam.ca
          port: 2243
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh_passphrase: ${{ secrets.SSH_PASSPHRASE }}
          local_path: './www/*'
          remote_path: /home/chaireca/public_html
          sftp_only: true
 



